<html lang="nl"><head><meta charset="utf-8">

<title>Enter Breda quiz</title>
<style>
:root{--p1:#3f2579;--p2:#6b42b8;--lime:#86b300;--limeD:#6d9300;--ink:#26194a;--ok:#2e9b4f;--bad:#c93a4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:#fff;
background:linear-gradient(160deg,var(--p1),var(--p2));overflow-x:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;padding:20px 5vw;background:rgba(255,255,255,.07)}
.logo{font-weight:800;letter-spacing:.02em;font-size:1.5rem;line-height:1}
.logo small{display:block;font-size:.75rem;font-weight:600;letter-spacing:.12em}
.prog{margin-left:auto;display:flex;gap:8px}
.prog i{width:34px;height:8px;border-radius:4px;background:rgba(255,255,255,.25)}
.prog i.on{background:var(--lime)}
main{max-width:900px;margin:0 auto;padding:5vh 5vw 8vh;text-align:center;min-height:calc(100% - 70px);display:flex;flex-direction:column;justify-content:center;align-items:center}
h1{font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.1;margin:0 0 .5em;font-weight:800}
h2{font-size:clamp(1.6rem,4.2vw,2.6rem);line-height:1.2;margin:0 0 1em;font-weight:800}
p{font-size:clamp(1.1rem,2.4vw,1.5rem);line-height:1.5;margin:0 0 1.6em;max-width:36em}
.btn{font:inherit;font-weight:700;font-size:1.4rem;background:var(--lime);color:#14200a;border:0;border-radius:12px;padding:18px 36px;cursor:pointer;min-height:64px}
.btn:active{background:var(--limeD);transform:scale(.98)}
.info{background:rgba(255,255,255,.12);border-left:6px solid var(--lime);border-radius:12px;padding:20px 26px;text-align:left;margin-bottom:2em;font-size:clamp(1.1rem,2.4vw,1.45rem);line-height:1.45;max-width:36em}
.opts{display:grid;gap:14px;width:100%;margin-bottom:1.6em}
.opt{font:inherit;font-size:clamp(1.1rem,2.4vw,1.4rem);text-align:left;background:#fff;color:var(--ink);border:3px solid #fff;border-radius:14px;padding:18px 22px;display:flex;gap:16px;align-items:center;cursor:pointer;min-height:72px;width:100%}
.opt b{flex:none;width:40px;height:40px;border-radius:50%;background:#ece6f7;display:grid;place-items:center;font-size:1.1rem}
.opt:active{transform:scale(.99)}
.opt.ok{background:#e4f6e9;border-color:var(--ok)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{background:#fbe6e9;border-color:var(--bad)}.opt.bad b{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opts.locked .opt{cursor:default}
.fb{min-height:2em;font-size:1.3rem;font-weight:700;margin-bottom:1em}
.score{font-size:clamp(3rem,10vw,5.5rem);font-weight:800;margin:0 0 .2em;color:var(--lime)}
.qr{background:#fff;border-radius:16px;padding:16px;width:min(260px,60vw);margin:0 auto 1.2em}
.qr svg{display:block;width:100%;height:auto}
.link{background:none;border:0;color:#fff;text-decoration:underline;font:inherit;font-size:1.1rem;cursor:pointer;padding:14px}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(10px)}}}

var cv=document.getElementById("cf"),cx=cv.getContext("2d"),P=[],run=false,COL=["#86b300","#ffffff","#b79af0","#ffd23f","#ff6b9d"];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
size();addEventListener("resize",size);
function confetti(n,x,y){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 var r=devicePixelRatio;
 for(var k=0;k<n;k++){var a=Math.random()*Math.PI*2,v=(8+Math.random()*(n>100?14:9))*r;
  P.push({x:x*r,y:y*r,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(n>100?4:7)*r,w:(6+Math.random()*6)*r,h:(10+Math.random()*8)*r,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:COL[k%COL.length],life:110+Math.random()*50})}
 if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
 P=P.filter(function(q){return q.life>0&&q.y<cv.height+40});
 P.forEach(function(q){q.vy+=.35*devicePixelRatio;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.rot+=q.vr;q.life--;
  cx.save();cx.translate(q.x,q.y);cx.rotate(q.rot);cx.globalAlpha=Math.min(1,q.life/30);cx.fillStyle=q.c;cx.fillRect(-q.w/2,-q.h/2,q.w,q.h);cx.restore()});
 if(P.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
var app=document.getElementById("app"),prog=document.getElementById("prog"),i=0,score=0,L="abc";

function show(){var x=Q[i];bar(i);

 x.o.forEach(function(t,k){h+='<button class="opt" data-k="'+k+'"><b>'+L[k]+'</b><span>'+t+'</span></button>'});

 box.onclick=function(e){var b=e.target.closest(".opt");if(!b||box.classList.contains("locked"))return;
  var k=+b.dataset.k;box.classList.add("locked");
  [].forEach.call(box.children,function(c,j){if(j===x.a)c.classList.add("ok");else if(j===k)c.classList.add("bad");else c.classList.add("dim")});

  document.getElementById("fb").textContent=right?"Goed zo!":"Net niet. Het goede antwoord staat groen.";

function end(){bar(Q.length);
 var s='<svg viewBox="-2 -2 '+(QR.n+4)+' '+(QR.n+4)+'" shape-rendering="crispEdges" role="img" aria-label="QR-code om je aan te melden bij Enter Breda"><rect x="-2" y="-2" width="'+(QR.n+4)+'" height="'+(QR.n+4)+'" fill="#fff"/><path d="'+QR.d+'" fill="#26194a"/></svg>';
 app.innerHTML='<div class="screen"><div class="score">'+score+' / '+Q.length+'</div><h2>'+(score===Q.length?"Alles goed!":score>=3?"Sterk gedaan!":"Goed geprobeerd!")+'</h2><p>Meld je aan bij Enter Breda en ontmoet bedrijven, volg workshops en bouw je netwerk op.</p><div class="qr">'+s+'</div><p style="margin-bottom:.8em">Scan de QR-code om je aan te melden</p><button class="link" id="again">Opnieuw spelen</button></div>';
 document.getElementById("again").onclick=start;
 if(score>=3){confetti(160,innerWidth*.25,innerHeight*.7);confetti(160,innerWidth*.75,innerHeight*.7);setTimeout(function(){confetti(120,innerWidth/2,innerHeight*.5)},350)}}
